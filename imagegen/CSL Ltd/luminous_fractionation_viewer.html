<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luminous Fractionation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }
        .container { display: flex; min-height: 100vh; padding: 20px; gap: 20px; }
        .sidebar {
            width: 320px; flex-shrink: 0; background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px); padding: 24px; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1); overflow-y: auto; overflow-x: hidden;
        }
        .sidebar h1 {
            font-family: 'Lora', serif; font-size: 24px; font-weight: 500;
            color: var(--anthropic-dark); margin-bottom: 8px;
        }
        .sidebar .subtitle {
            color: var(--anthropic-mid-gray); font-size: 14px; margin-bottom: 32px; line-height: 1.4;
        }
        .control-section { margin-bottom: 32px; }
        .control-section h3 {
            font-size: 16px; font-weight: 600; color: var(--anthropic-dark);
            margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
        }
        .control-section h3::before {
            content: '•'; color: var(--anthropic-orange); font-weight: bold;
        }
        .seed-input {
            width: 100%; background: var(--anthropic-light); padding: 12px; border-radius: 8px;
            font-family: 'Courier New', monospace; font-size: 14px; margin-bottom: 12px;
            border: 1px solid var(--anthropic-light-gray); text-align: center;
        }
        .seed-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        .control-group { margin-bottom: 20px; }
        .control-group label {
            display: block; font-size: 14px; font-weight: 500; color: var(--anthropic-dark); margin-bottom: 8px;
        }
        .slider-container { display: flex; align-items: center; gap: 12px; }
        .slider-container input[type="range"] {
            flex: 1; height: 4px; background: var(--anthropic-light-gray); border-radius: 2px; outline: none;
            -webkit-appearance: none;
        }
        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 16px; height: 16px; background: var(--anthropic-orange); border-radius: 50%;
        }
        .slider-container input[type="range"]::-moz-range-thumb {
            width: 16px; height: 16px; background: var(--anthropic-orange); border-radius: 50%; border: none;
        }
        .value-display {
            font-family: 'Courier New', monospace; font-size: 12px; color: var(--anthropic-mid-gray); min-width: 60px; text-align: right;
        }
        .color-group { margin-bottom: 16px; }
        .color-group label { display: block; font-size: 12px; color: var(--anthropic-mid-gray); margin-bottom: 4px; }
        .color-picker-container { display: flex; align-items: center; gap: 8px; }
        .color-picker-container input[type="color"] {
            width: 32px; height: 32px; border: none; border-radius: 6px; cursor: pointer; background: none; padding: 0;
        }
        .color-value { font-family: 'Courier New', monospace; font-size: 12px; color: var(--anthropic-mid-gray); }
        .button {
            background: var(--anthropic-orange); color: white; border: none; padding: 10px 16px; border-radius: 6px;
            font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s ease; width: 100%;
        }
        .button.secondary { background: var(--anthropic-blue); }
        .button.tertiary { background: var(--anthropic-green); }
        .button-row { display: flex; gap: 8px; }
        .button-row .button { flex: 1; }
        .canvas-area {
            flex: 1; display: flex; align-items: center; justify-content: center; min-width: 0;
        }
        #canvas-container {
            width: 100%; max-width: 1000px; border-radius: 12px; overflow: hidden;
            box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1); background: white;
        }
        #canvas-container canvas {
            display: block; width: 100% !important; height: auto !important;
        }
        .loading {
            display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--anthropic-mid-gray); min-height: 360px;
        }
        @media (max-width: 600px) {
            .container { flex-direction: column; }
            .sidebar { width: 100%; }
            .canvas-area { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>Luminous Fractionation</h1>
            <div class="subtitle">A seeded field study in pressure, purification, and disciplined flow.</div>

            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="12345" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <button class="button tertiary" onclick="randomSeedAndUpdate()">↻ Random</button>
            </div>

            <div class="control-section">
                <h3>Parameters</h3>
                <div class="control-group">
                    <label>Particle Count</label>
                    <div class="slider-container">
                        <input type="range" id="particleCount" min="1200" max="8200" step="200" value="3600" oninput="updateParam('particleCount', this.value)">
                        <span class="value-display" id="particleCount-value">3600</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Turbulence</label>
                    <div class="slider-container">
                        <input type="range" id="turbulence" min="0.2" max="1.6" step="0.05" value="0.85" oninput="updateParam('turbulence', this.value)">
                        <span class="value-display" id="turbulence-value">0.85</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Drift Scale</label>
                    <div class="slider-container">
                        <input type="range" id="driftScale" min="0.0008" max="0.008" step="0.0002" value="0.0032" oninput="updateParam('driftScale', this.value)">
                        <span class="value-display" id="driftScale-value">0.0032</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Ribbon Width</label>
                    <div class="slider-container">
                        <input type="range" id="ribbonWidth" min="1" max="8" step="1" value="3" oninput="updateParam('ribbonWidth', this.value)">
                        <span class="value-display" id="ribbonWidth-value">3</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Contrast</label>
                    <div class="slider-container">
                        <input type="range" id="contrast" min="0.45" max="1.25" step="0.05" value="0.9" oninput="updateParam('contrast', this.value)">
                        <span class="value-display" id="contrast-value">0.9</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>Colors</h3>
                <div class="color-group">
                    <label>Base Ink</label>
                    <div class="color-picker-container">
                        <input type="color" id="color1" value="#36454f" onchange="updateColor('color1', this.value)">
                        <span class="color-value" id="color1-value">#36454f</span>
                    </div>
                </div>
                <div class="color-group">
                    <label>Soft Slate</label>
                    <div class="color-picker-container">
                        <input type="color" id="color2" value="#708090" onchange="updateColor('color2', this.value)">
                        <span class="color-value" id="color2-value">#708090</span>
                    </div>
                </div>
                <div class="color-group">
                    <label>Catalyst</label>
                    <div class="color-picker-container">
                        <input type="color" id="color3" value="#a9b7c3" onchange="updateColor('color3', this.value)">
                        <span class="color-value" id="color3-value">#a9b7c3</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row">
                    <button class="button" onclick="resetParameters()">Reset</button>
                </div>
            </div>
        </div>

        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Initializing generative art...</div>
            </div>
        </div>
    </div>

    <script>
        let params = {
            seed: 12345,
            particleCount: 3600,
            turbulence: 0.85,
            driftScale: 0.0032,
            ribbonWidth: 3,
            contrast: 0.9,
            colorPalette: ['#36454f', '#708090', '#a9b7c3']
        };
        const defaultParams = JSON.parse(JSON.stringify(params));
        let particles = [];

        function setup() {
            const canvas = createCanvas(1200, 1200);
            canvas.parent('canvas-container');
            pixelDensity(1);
            initializeSystem();
            const loading = document.querySelector('.loading');
            if (loading) loading.style.display = 'none';
            noLoop();
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);
            particles = [];
            background(248, 247, 243);
            for (let i = 0; i < params.particleCount; i++) {
                particles.push(new Particle(i));
            }
            drawArtwork();
        }

        function drawArtwork() {
            background(248, 247, 243);
            strokeWeight(1);
            noFill();

            for (const particle of particles) {
                particle.run();
            }

            drawFieldLines();
            drawCoreRing();
        }

        function draw() {}

        function fieldAngle(x, y) {
            const cx = width * 0.52;
            const cy = height * 0.51;
            const dx = x - cx;
            const dy = y - cy;
            const radius = Math.sqrt(dx * dx + dy * dy) + 1;
            const swirl = Math.atan2(dy, dx) + params.turbulence * 0.75;
            const n = noise(x * params.driftScale, y * params.driftScale) * TWO_PI * 3.0;
            const pull = Math.sin(radius * 0.012 + params.seed * 0.001) * 0.4;
            return swirl + n * params.turbulence * 0.36 + pull;
        }

        class Particle {
            constructor(index) {
                const ring = random([0.18, 0.24, 0.31, 0.39]);
                const angle = random(TWO_PI);
                const radius = ring * width + random(-40, 40);
                this.x = width * 0.52 + Math.cos(angle) * radius;
                this.y = height * 0.51 + Math.sin(angle) * radius;
                this.life = 48 + (index % 72);
                this.alpha = 20 + random(48) * params.contrast;
            }
            run() {
                let px = this.x;
                let py = this.y;
                for (let step = 0; step < this.life; step++) {
                    const angle = fieldAngle(px, py);
                    const stepSize = 1.5 + noise(px * 0.002, py * 0.002) * 2.4;
                    const nx = px + Math.cos(angle) * stepSize;
                    const ny = py + Math.sin(angle) * stepSize;
                    const blend = step / Math.max(1, this.life - 1);
                    const colorA = color(params.colorPalette[0]);
                    const colorB = color(params.colorPalette[1]);
                    const colorC = color(params.colorPalette[2]);
                    let c = lerpColor(colorA, colorB, blend);
                    if (blend > 0.6) {
                        c = lerpColor(colorB, colorC, (blend - 0.6) / 0.4);
                    }
                    stroke(red(c), green(c), blue(c), this.alpha * (1 - blend * 0.65));
                    strokeWeight(params.ribbonWidth * (1 - blend * 0.7));
                    line(px, py, nx, ny);
                    px = nx;
                    py = ny;
                    if (px < -40 || py < -40 || px > width + 40 || py > height + 40) break;
                }
            }
        }

        function drawFieldLines() {
            push();
            noFill();
            stroke(54, 69, 79, 18 * params.contrast);
            strokeWeight(1);
            for (let r = 180; r <= 440; r += 48) {
                beginShape();
                for (let a = 0; a <= TWO_PI + 0.08; a += 0.08) {
                    const mod = noise(Math.cos(a) * 0.8 + r * 0.01, Math.sin(a) * 0.8 + params.seed * 0.001);
                    const rr = r + (mod - 0.5) * 64 * params.turbulence;
                    const x = width * 0.52 + Math.cos(a) * rr;
                    const y = height * 0.51 + Math.sin(a) * rr;
                    curveVertex(x, y);
                }
                endShape();
            }
            pop();
        }

        function drawCoreRing() {
            push();
            translate(width * 0.52, height * 0.51);
            noFill();
            stroke(112, 128, 144, 50);
            strokeWeight(10);
            ellipse(0, 0, 180, 180);
            stroke(169, 183, 195, 80);
            strokeWeight(4);
            ellipse(0, 0, 246, 246);
            pop();
        }

        function updateParam(key, value) {
            params[key] = Number(value);
            document.getElementById(`${key}-value`).textContent = value;
            initializeSystem();
        }

        function updateColor(id, value) {
            const map = { color1: 0, color2: 1, color3: 2 };
            params.colorPalette[map[id]] = value;
            document.getElementById(`${id}-value`).textContent = value;
            initializeSystem();
        }

        function updateSeed() {
            params.seed = Number(document.getElementById('seed-input').value) || 12345;
            initializeSystem();
        }

        function previousSeed() {
            params.seed -= 1;
            document.getElementById('seed-input').value = params.seed;
            initializeSystem();
        }

        function nextSeed() {
            params.seed += 1;
            document.getElementById('seed-input').value = params.seed;
            initializeSystem();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999);
            document.getElementById('seed-input').value = params.seed;
            initializeSystem();
        }

        function resetParameters() {
            params = JSON.parse(JSON.stringify(defaultParams));
            for (const [key, value] of Object.entries(defaultParams)) {
                if (key === 'colorPalette') continue;
                const input = document.getElementById(key);
                if (input) input.value = value;
                const output = document.getElementById(`${key}-value`);
                if (output) output.textContent = value;
            }
            ['color1', 'color2', 'color3'].forEach((id, idx) => {
                document.getElementById(id).value = defaultParams.colorPalette[idx];
                document.getElementById(`${id}-value`).textContent = defaultParams.colorPalette[idx];
            });
            document.getElementById('seed-input').value = defaultParams.seed;
            initializeSystem();
        }
    </script>
</body>
</html>
