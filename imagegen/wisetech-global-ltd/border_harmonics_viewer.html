<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border Harmonics</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }
        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }
        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto;
            overflow-x: hidden;
        }
        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 24px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }
        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.4;
        }
        .control-section { margin-bottom: 32px; }
        .control-section h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .control-section h3::before {
            content: '•';
            color: var(--anthropic-orange);
            font-weight: bold;
        }
        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
        }
        .seed-input:focus {
            outline: none;
            border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1);
            background: white;
        }
        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }
        .regen-button { margin-bottom: 0; }
        .control-group { margin-bottom: 20px; }
        .control-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }
        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }
        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
        }
        .slider-container input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            border: none;
            cursor: pointer;
        }
        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            min-width: 60px;
            text-align: right;
        }
        .button {
            background: var(--anthropic-orange);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }
        .button:hover { background: #c86641; transform: translateY(-1px); }
        .button.secondary { background: var(--anthropic-blue); }
        .button.secondary:hover { background: #5a8bb8; }
        .button.tertiary { background: var(--anthropic-green); }
        .button.tertiary:hover { background: #6b7b52; }
        .button-row { display: flex; gap: 8px; }
        .button-row .button { flex: 1; }
        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }
        #canvas-container {
            width: 100%;
            max-width: 1000px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1);
            background: white;
        }
        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--anthropic-mid-gray);
            min-height: 720px;
        }
        @media (max-width: 600px) {
            .container { flex-direction: column; }
            .sidebar { width: 100%; }
            .canvas-area { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>Border Harmonics</h1>
            <div class="subtitle">A generative field for global trade pressure, document flow, and hidden operating systems.</div>

            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="31415" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <button class="button tertiary regen-button" onclick="randomSeedAndUpdate()">↻ Random</button>
            </div>

            <div class="control-section">
                <h3>Parameters</h3>

                <div class="control-group">
                    <label>Lane Count</label>
                    <div class="slider-container">
                        <input type="range" id="laneCount" min="48" max="180" step="4" value="96" oninput="updateParam('laneCount', this.value)">
                        <span class="value-display" id="laneCount-value">96</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Border Pull</label>
                    <div class="slider-container">
                        <input type="range" id="borderPull" min="0.2" max="1.7" step="0.05" value="0.95" oninput="updateParam('borderPull', this.value)">
                        <span class="value-display" id="borderPull-value">0.95</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Noise Grain</label>
                    <div class="slider-container">
                        <input type="range" id="noiseScale" min="0.0007" max="0.0045" step="0.0001" value="0.0018" oninput="updateParam('noiseScale', this.value)">
                        <span class="value-display" id="noiseScale-value">0.0018</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Memory Trails</label>
                    <div class="slider-container">
                        <input type="range" id="trailStrength" min="0.04" max="0.28" step="0.01" value="0.11" oninput="updateParam('trailStrength', this.value)">
                        <span class="value-display" id="trailStrength-value">0.11</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row">
                    <button class="button" onclick="resetParameters()">Reset</button>
                </div>
            </div>
        </div>

        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Initializing generative art...</div>
            </div>
        </div>
    </div>

    <script>
        let params = {
            seed: 31415,
            laneCount: 96,
            borderPull: 0.95,
            noiseScale: 0.0018,
            trailStrength: 0.11
        };

        const defaultParams = {...params};
        let lanes = [];
        let pulses = [];
        let fieldPhase = 0;

        function setup() {
            const canvas = createCanvas(1200, 1200);
            canvas.parent('canvas-container');
            initializeSystem();
            const loading = document.querySelector('.loading');
            if (loading) {
                loading.style.display = 'none';
            }
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);
            lanes = [];
            pulses = [];
            fieldPhase = random(1000);
            background(247, 247, 245);

            for (let i = 0; i < params.laneCount; i++) {
                lanes.push(new Lane(i));
            }

            for (let i = 0; i < params.laneCount * 0.7; i++) {
                pulses.push(new Pulse(random(width), random(height), i));
            }
        }

        function drawBackdrop() {
            push();
            noFill();
            strokeWeight(1);
            for (let i = 0; i < 22; i++) {
                const alpha = 8 + i * 0.8;
                stroke(54, 69, 79, alpha);
                const y = map(i, 0, 21, 90, height - 90);
                bezier(
                    80, y + sin(i * 0.3 + frameCount * 0.003) * 10,
                    width * 0.35, y - 22,
                    width * 0.66, y + 22,
                    width - 80, y + cos(i * 0.24 + frameCount * 0.003) * 10
                );
            }
            pop();

            push();
            stroke(34, 42, 48, 32);
            strokeWeight(1);
            for (let x = 100; x < width; x += 110) {
                line(x, 90, x, height - 90);
            }
            for (let y = 100; y < height; y += 110) {
                line(90, y, width - 90, y);
            }
            pop();
        }

        function flowVector(x, y) {
            const edgeBias = sin((x / width) * PI) * sin((y / height) * PI);
            const borderField = sin((x * params.noiseScale * 1.7) + fieldPhase) * 0.6
                + cos((y * params.noiseScale * 1.2) - fieldPhase * 0.7) * 0.4;
            const n = noise(x * params.noiseScale, y * params.noiseScale, fieldPhase * 0.025);
            const angle = TAU * (n * 0.72 + borderField * 0.12 + edgeBias * 0.16);
            const v = p5.Vector.fromAngle(angle);
            const centerPull = createVector(width * 0.5 - x, height * 0.5 - y).mult(0.00042 * params.borderPull);
            v.add(centerPull);
            return v.normalize();
        }

        function draw() {
            background(247, 247, 245, 255 * params.trailStrength);
            drawBackdrop();

            for (const lane of lanes) {
                lane.step();
                lane.render();
            }

            for (const pulse of pulses) {
                pulse.step();
                pulse.render();
            }

            push();
            noStroke();
            fill(20, 20, 19, 20);
            rect(70, 70, width - 140, height - 140, 28);
            fill(247, 247, 245, 220);
            rect(84, 84, width - 168, height - 168, 22);
            pop();

            drawBackdrop();

            push();
            fill(20, 20, 19, 20);
            rect(120, 120, width - 240, height - 240, 16);
            fill(247, 247, 245, 255);
            rect(126, 126, width - 252, height - 252, 12);
            pop();

            for (const lane of lanes) {
                lane.render(true);
            }

            push();
            noStroke();
            fill(20, 20, 19, 220);
            textAlign(LEFT, TOP);
            textFont('Poppins');
            textSize(22);
            text('Border Harmonics', 150, 150);
            fill(108, 122, 133, 255);
            textSize(13);
            text('Hidden operating layers for regulated motion', 150, 182);
            text(`Seed ${params.seed}`, 150, 202);
            pop();

            fieldPhase += 0.004;
        }

        class Lane {
            constructor(index) {
                this.index = index;
                this.points = [];
                this.reset(true);
            }

            reset(first = false) {
                const side = floor(random(4));
                if (side === 0) {
                    this.pos = createVector(random(width), 0);
                } else if (side === 1) {
                    this.pos = createVector(width, random(height));
                } else if (side === 2) {
                    this.pos = createVector(random(width), height);
                } else {
                    this.pos = createVector(0, random(height));
                }
                this.vel = createVector(0, 0);
                this.life = first ? random(110, 220) : random(160, 320);
                this.hueMix = random();
                this.points = [this.pos.copy()];
            }

            step() {
                const v = flowVector(this.pos.x, this.pos.y).mult(2.1 + this.hueMix * 1.4);
                const border = createVector(
                    map(noise(this.pos.y * 0.002, fieldPhase), 0, 1, -1, 1),
                    map(noise(this.pos.x * 0.002, fieldPhase + 20), 0, 1, -1, 1)
                ).mult(0.15 * params.borderPull);
                this.vel.lerp(v.add(border), 0.18);
                this.pos.add(this.vel);
                this.points.push(this.pos.copy());
                if (this.points.length > 28) {
                    this.points.shift();
                }
                this.life -= 1;

                if (this.life <= 0 || this.pos.x < -40 || this.pos.x > width + 40 || this.pos.y < -40 || this.pos.y > height + 40) {
                    this.reset();
                }
            }

            render(overlay = false) {
                noFill();
                beginShape();
                const alpha = overlay ? 110 : 58;
                const tone = overlay ? 64 : 102;
                strokeWeight(overlay ? 1.4 : 2.6);
                stroke(tone, tone + 8, tone + 12, alpha);
                for (const p of this.points) {
                    curveVertex(p.x, p.y);
                }
                endShape();

                if (overlay) {
                    const p = this.points[this.points.length - 1];
                    noStroke();
                    fill(118, 128, 142, 90);
                    circle(p.x, p.y, 4);
                }
            }
        }

        class Pulse {
            constructor(x, y, index) {
                this.base = createVector(x, y);
                this.index = index;
                this.radius = random(24, 80);
                this.speed = random(0.004, 0.012);
                this.phase = random(TAU);
            }

            step() {
                this.phase += this.speed;
            }

            render() {
                const r = this.radius + sin(this.phase + this.index * 0.11) * 8;
                noFill();
                stroke(112, 128, 144, 18);
                strokeWeight(1);
                circle(this.base.x, this.base.y, r * 2);
                stroke(54, 69, 79, 10);
                circle(this.base.x, this.base.y, r * 1.3);
            }
        }

        function updateParam(paramName, value) {
            const parsed = parseFloat(value);
            params[paramName] = parsed;
            document.getElementById(`${paramName}-value`).textContent = String(value);
            initializeSystem();
        }

        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            const input = document.getElementById('seed-input');
            const newSeed = parseInt(input.value, 10);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                initializeSystem();
            } else {
                updateSeedDisplay();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            initializeSystem();
        }

        function nextSeed() {
            params.seed = params.seed + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function resetParameters() {
            params = {...defaultParams};
            for (const [id, value] of Object.entries({
                laneCount: params.laneCount,
                borderPull: params.borderPull,
                noiseScale: params.noiseScale,
                trailStrength: params.trailStrength
            })) {
                document.getElementById(id).value = value;
                document.getElementById(`${id}-value`).textContent = value;
            }
            updateSeedDisplay();
            initializeSystem();
        }

        window.addEventListener('load', function() {
            updateSeedDisplay();
        });
    </script>
</body>
</html>
