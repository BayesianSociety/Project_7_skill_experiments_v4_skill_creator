<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">Slide 2 - Science Is Accelerating</title>
  <desc id="desc">Instagram slide showing publication growth for lenacapavir-related research.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#173642"/>
      <stop offset="55%" stop-color="#d56d52"/>
      <stop offset="100%" stop-color="#e9c46a"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect x="140" y="150" width="800" height="780" rx="48" fill="#fff8f1" fill-opacity="0.92"/>
  <g fill="none" stroke="#264653" stroke-opacity="0.12">
    <path d="M220 730H860"/>
    <path d="M220 650H860"/>
    <path d="M220 570H860"/>
  </g>
  <polyline points="250,718 370,675 490,610 610,430 730,286 830,236" fill="none" stroke="#e76f51" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#264653">
    <circle cx="250" cy="718" r="14"/>
    <circle cx="370" cy="675" r="14"/>
    <circle cx="490" cy="610" r="14"/>
    <circle cx="610" cy="430" r="14"/>
