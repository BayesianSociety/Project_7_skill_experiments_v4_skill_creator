<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Innovation Readiness Dashboard</title>
  <style>
    :root {
      --dusty-rose: #d4a5a5;
      --clay: #b87d6d;
      --sand: #e8d5c4;
      --burgundy: #5d2e46;
      --paper: #fff8f3;
      --ink: #251922;
      --muted: #7b6267;
      --line: rgba(93, 46, 70, 0.18);
      --green: #65765c;
      --amber: #a8663f;
      --shadow: 0 18px 70px rgba(93, 46, 70, 0.13);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% -10%, rgba(255, 248, 243, 0.9), transparent 38%),
        linear-gradient(180deg, #f6ebe2 0%, var(--sand) 48%, #f3e4dc 100%);
      font-family: FreeSans, Arial, Helvetica, sans-serif;
      line-height: 1.45;
    }
    a { color: var(--burgundy); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .shell { width: min(1180px, calc(100vw - 36px)); margin: 0 auto; }
    header {
      padding: 30px 0 22px;
      border-bottom: 1px solid var(--line);
    }
    .eyebrow {
      color: var(--clay);
      font-size: 12px;
      letter-spacing: 0;
      text-transform: uppercase;
      font-weight: 700;
    }
    h1, h2, h3 {
      font-family: FreeSans, Arial, Helvetica, sans-serif;
      letter-spacing: 0;
      margin: 0;
      color: var(--burgundy);
    }
    h1 {
      font-size: clamp(38px, 6vw, 82px);
      line-height: 0.95;
      max-width: 920px;
      margin-top: 14px;
    }
    h2 { font-size: clamp(25px, 3vw, 42px); line-height: 1.08; }
    h3 { font-size: 17px; line-height: 1.2; }
    p { margin: 0; color: var(--muted); }
    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 42px;
      align-items: end;
      padding: 54px 0 48px;
    }
    .subhead {
      margin-top: 20px;
      max-width: 690px;
      font-size: 18px;
    }
    .score-block {
      background: rgba(255, 248, 243, 0.7);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      padding: 24px;
    }
    .score-number {
      color: var(--burgundy);
      font-size: 74px;
      line-height: 0.9;
      font-weight: 800;
    }
    .score-number small { font-size: 20px; color: var(--muted); font-weight: 600; }
    .verdict { margin-top: 14px; color: var(--ink); font-weight: 700; }
    .gate {
      margin-top: 18px;
      display: inline-flex;
      gap: 8px;
      align-items: center;
      padding: 7px 10px;
      border: 1px solid var(--line);
      background: rgba(212, 165, 165, 0.18);
      color: var(--burgundy);
      font-size: 13px;
      font-weight: 700;
    }
    main { padding: 8px 0 74px; }
    section {
      padding: 42px 0;
      border-top: 1px solid var(--line);
    }
    .section-head {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      gap: 34px;
      margin-bottom: 26px;
    }
    .section-head p { max-width: 790px; }
    .layers {
      display: grid;
      gap: 14px;
    }
    .layer-row {
      background: rgba(255, 248, 243, 0.66);
      border: 1px solid var(--line);
      padding: 18px;
      transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
    }
    .layer-row:hover {
      transform: translateY(-2px);
      border-color: rgba(184, 125, 109, 0.55);
      background: rgba(255, 248, 243, 0.86);
    }
    .layer-top {
      display: grid;
      grid-template-columns: 170px minmax(0, 1fr) 70px;
      gap: 16px;
      align-items: center;
    }
    .bar-track {
      height: 8px;
      background: rgba(93, 46, 70, 0.14);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--clay), var(--dusty-rose));
      box-shadow: 0 0 18px rgba(184, 125, 109, 0.28);
      transition: width 900ms cubic-bezier(.2, .8, .2, 1);
    }
    .score-label {
      color: var(--burgundy);
      font-weight: 800;
      text-align: right;
      white-space: nowrap;
    }
    .layer-copy {
      display: grid;
      grid-template-columns: 1fr 1fr 0.7fr;
      gap: 18px;
      padding-top: 14px;
      color: var(--muted);
      font-size: 14px;
    }
    .mini-label {
      color: var(--clay);
      display: block;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .grid-two {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px 28px;
    }
    .grid-three {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }
    .panel {
      background: rgba(255, 248, 243, 0.62);
      border: 1px solid var(--line);
      padding: 20px;
      min-height: 100%;
    }
    .panel p, li { font-size: 14px; }
    ul.clean { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
    .item-title { color: var(--burgundy); font-weight: 800; margin-bottom: 5px; }
    .tag {
      display: inline-block;
      padding: 3px 8px;
      border: 1px solid var(--line);
      color: var(--burgundy);
      background: rgba(212, 165, 165, 0.18);
      font-size: 12px;
      font-weight: 700;
      margin-top: 10px;
    }
    .chart {
      display: grid;
      gap: 10px;
    }
    .bars {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }
    .bar-line {
      display: grid;
      grid-template-columns: 62px minmax(0, 1fr) 72px;
      gap: 10px;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
    }
    .thin-track {
      height: 7px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(93, 46, 70, 0.12);
    }
    .thin-fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: var(--green);
      transition: width 900ms cubic-bezier(.2, .8, .2, 1);
    }
    .snapshot {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      border-top: 1px solid var(--line);
      border-left: 1px solid var(--line);
    }
    .snapshot div {
      padding: 16px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: rgba(255, 248, 243, 0.52);
    }
    .snapshot strong {
      display: block;
      color: var(--burgundy);
      font-size: 22px;
      margin: 4px 0;
    }
    .severity-high { color: #7d2c24; }
    .severity-medium { color: var(--amber); }
    .sources {
      display: grid;
      gap: 10px;
      font-size: 13px;
    }
    .source-row {
      display: grid;
      grid-template-columns: 110px minmax(0, 1fr) 132px;
      gap: 12px;
      padding: 11px 0;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
    }
    .source-row strong { color: var(--burgundy); }
    .reveal {
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 600ms ease, transform 600ms ease;
    }
    .reveal.in { opacity: 1; transform: translateY(0); }
    footer {
      padding: 28px 0 42px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
    }
    @media (max-width: 900px) {
      .hero-grid, .section-head, .grid-two, .grid-three, .layer-copy {
        grid-template-columns: 1fr;
      }
      .layer-top {
        grid-template-columns: 1fr;
        gap: 9px;
      }
      .score-label { text-align: left; }
      .snapshot { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .source-row { grid-template-columns: 1fr; }
    }
    @media (max-width: 560px) {
      .shell { width: min(100vw - 24px, 1180px); }
      header { padding-top: 22px; }
      .hero-grid { padding: 34px 0; }
      .score-number { font-size: 58px; }
      .snapshot { grid-template-columns: 1fr; }
      section { padding: 34px 0; }
    }
  </style>
</head>

  <header>
    <div class="shell hero-grid">
      <div class="reveal">
        <div class="eyebrow" id="ticker"></div>
        <h1 id="headline"></h1>
        <p class="subhead" id="subheadline"></p>
      </div>
      <aside class="score-block reveal">
        <div class="eyebrow">Readiness Score</div>
        <div class="score-number"><span id="totalScore"></span><small>/25</small></div>
        <div class="verdict" id="verdict"></div>
        <div class="gate" id="gate"></div>
      </aside>
    </div>
  </header>
  <main class="shell">
    <section class="reveal">
      <div class="section-head">
        <h2>Five Layers</h2>
        <p id="layerIntro"></p>
      </div>
      <div id="layers" class="layers"></div>
    </section>
    <section class="reveal">
      <div class="section-head">
        <h2 id="thesisTitle"></h2>
        <p id="thesisSummary"></p>
      </div>
      <div id="thesisBullets" class="grid-three"></div>
    </section>
    <section class="reveal">
      <div class="section-head">
        <h2 id="techTitle"></h2>
        <p id="techSummary"></p>
      </div>
      <div id="techItems" class="grid-three"></div>
    </section>
    <section class="reveal">
      <div class="section-head">
        <h2 id="quantTitle"></h2>
        <p id="quantSummary"></p>
      </div>
      <div id="charts" class="grid-two"></div>
    </section>
    <section class="reveal">
      <div class="section-head">
        <h2 id="commercialTitle"></h2>
        <p id="commercialSummary"></p>
      </div>
      <div id="commercialItems" class="grid-three"></div>
    </section>
    <section class="reveal">
      <div class="section-head">
        <h2 id="gateTitle"></h2>
        <p id="gateSummary"></p>
      </div>
      <div class="grid-two">
        <div class="panel"><h3>Met</h3><ul id="metList" class="clean"></ul></div>
        <div class="panel"><h3>Not Met</h3><ul id="notMetList" class="clean"></ul><span class="tag" id="gateResult"></span></div>
      </div>
    </section>
    <section class="reveal">
      <div class="section-head">
        <h2 id="uniTitle"></h2>
        <p id="uniSummary"></p>
      </div>
      <div id="universities" class="grid-three"></div>
    </section>
    <section class="reveal">
      <div class="section-head">
        <h2 id="patentTitle"></h2>
        <p id="patentSummary"></p>
      </div>
      <div id="patents" class="grid-three"></div>
    </section>
    <section class="reveal">
      <div class="section-head">
        <h2>Red Flags</h2>
        <p id="redFlagSummary"></p>
      </div>
      <div id="redFlags" class="grid-two"></div>
    </section>
    <section class="reveal">
      <div class="section-head">
        <h2 id="watchTitle"></h2>
        <p id="watchSummary"></p>
      </div>
      <div class="grid-two">
        <div class="panel"><h3>Upgrade</h3><ul id="upgradeList" class="clean"></ul></div>
        <div class="panel"><h3>Downgrade</h3><ul id="downgradeList" class="clean"></ul></div>
      </div>
    </section>
    <section class="reveal">
      <div class="section-head">
        <h2 id="snapshotTitle"></h2>
        <p>Selected operating metrics from the scored dataset.</p>
      </div>
      <div id="snapshot" class="snapshot"></div>
    </section>
    <section class="reveal">
      <div class="section-head">
        <h2 id="methodTitle"></h2>
        <p id="bottomLine"></p>
      </div>
      <div class="grid-two">
        <div class="panel"><h3>Notes</h3><ul id="methodNotes" class="clean"></ul></div>
        <div class="panel"><h3>Sources</h3><div id="sources" class="sources"></div></div>
      </div>
    </section>
  </main>
  <footer>
    <div class="shell" id="footerMeta"></div>
  </footer>
  <script>
    const data = JSON.parse(document.getElementById('scored-data').textContent);
    const dc = data.dashboard_content;
    const $ = (id) => document.getElementById(id);
    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (ch) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const refs = (item) => {
      const ids = [...(item.evidence_ids || []), ...(item.source_ids || [])];
      return ids.length ? `<span class="tag">${esc(ids.slice(0, 3).join(' | '))}</span>` : '';
    };
    $('ticker').textContent = `${data.ticker} | ${data.research_run.research_date}`;
    $('headline').textContent = dc.hero.headline;
    $('subheadline').textContent = dc.hero.subheadline;
    $('totalScore').textContent = data.display_total_score;
    $('verdict').textContent = data.verdict;
    $('gate').textContent = data.gate_pass ? 'Gate: pass' : 'Gate: not passed';
    $('layerIntro').textContent = dc.breakthrough_gate.summary;
    $('layers').innerHTML = data.layers.map(layer => {
      const pct = Math.max(0, Math.min(100, (Number(layer.score) / 5) * 100));
      return `<article class="layer-row">
        <div class="layer-top">
          <h3>${esc(layer.label)}</h3>
          <div class="bar-track"><div class="bar-fill" data-width="${pct.toFixed(1)}"></div></div>
          <div class="score-label">${esc(layer.display_score)} / 5</div>
        </div>
        <div class="layer-copy">
          <p><span class="mini-label">Evidence</span>${esc(layer.summary)}</p>
          <p><span class="mini-label">Strong</span>${esc(layer.strong)}</p>
          <p><span class="mini-label">Missing</span>${esc(layer.missing)}<br><span class="tag">${esc(layer.confidence)} confidence</span></p>
        </div>
      </article>`;
    }).join('');

    $('thesisTitle').textContent = dc.thesis.title;
    $('thesisSummary').textContent = dc.thesis.summary;
    $('thesisBullets').innerHTML = dc.thesis.bullets.map(item => `<article class="panel"><p>${esc(item.text)}</p>${refs(item)}</article>`).join('');

    $('techTitle').textContent = dc.technology_map.title;
    $('techSummary').textContent = dc.technology_map.summary;
    $('techItems').innerHTML = dc.technology_map.items.map(item => `<article class="panel"><h3>${esc(item.name)}</h3><p>${esc(item.description)}</p><span class="tag">${esc(item.maturity)}</span></article>`).join('');

    $('quantTitle').textContent = dc.quantitative_signals.title;
    $('quantSummary').textContent = dc.quantitative_signals.summary;
    $('charts').innerHTML = dc.quantitative_signals.charts.map(chart => {
      const points = chart.series[0].points;
      const max = Math.max(...points.map(p => Number(p.value)));
      const bars = points.map(p => `<div class="bar-line"><span>${esc(p.period)}</span><div class="thin-track"><div class="thin-fill" data-width="${((Number(p.value) / max) * 100).toFixed(1)}"></div></div><strong>${esc(p.value)}</strong></div>`).join('');
      return `<article class="panel chart"><h3>${esc(chart.title)}</h3><p>${esc(chart.description)}</p><div class="bars">${bars}</div></article>`;
    }).join('');

    $('commercialTitle').textContent = dc.commercialization_evidence.title;
    $('commercialSummary').textContent = dc.commercialization_evidence.summary;
    $('commercialItems').innerHTML = dc.commercialization_evidence.items.map(item => `<article class="panel"><div class="item-title">${esc(item.label)}</div><p>${esc(item.text)}</p>${refs(item)}</article>`).join('');

    $('gateTitle').textContent = dc.breakthrough_gate.title;
    $('gateSummary').textContent = dc.breakthrough_gate.summary;
    $('metList').innerHTML = dc.breakthrough_gate.conditions_met.map(item => `<li><p>${esc(item.condition)}</p>${refs(item)}</li>`).join('');
    $('notMetList').innerHTML = dc.breakthrough_gate.conditions_not_met.map(item => `<li><p>${esc(item.condition)}</p>${refs(item)}</li>`).join('');
    $('gateResult').textContent = dc.breakthrough_gate.result;

    $('uniTitle').textContent = dc.university_research_signals.title;
    $('uniSummary').textContent = dc.university_research_signals.summary;
    $('universities').innerHTML = dc.university_research_signals.institutions.map(item => `<article class="panel"><h3>${esc(item.name)}</h3><p>${esc(item.signal)}</p><span class="tag">${item.field_proxy ? 'field proxy' : 'company attributable'}</span></article>`).join('');

    $('patentTitle').textContent = dc.patent_signals.title;
    $('patentSummary').textContent = dc.patent_signals.summary;
    $('patents').innerHTML = dc.patent_signals.families.map(item => `<article class="panel"><h3>${esc(item.title)}</h3><p>${esc(item.interpretation)}</p><span class="tag">${esc(item.publication_or_family_id)} | ${esc((item.jurisdictions || []).join(', '))}</span></article>`).join('');

    $('redFlagSummary').textContent = 'Concrete cautions from the scored research payload.';
    $('redFlags').innerHTML = dc.red_flags.map(item => `<article class="panel"><h3 class="severity-${esc(item.severity)}">${esc(item.title)}</h3><p>${esc(item.text)}</p><span class="tag">${esc(item.severity)} | ${esc(item.layer || '')}</span></article>`).join('');

    $('watchTitle').textContent = dc.watchlist.title;
    $('watchSummary').textContent = 'Signals to monitor before changing the readiness view.';
    $('upgradeList').innerHTML = dc.watchlist.upgrade_signals.map(item => `<li><p>${esc(item.text)}</p><span class="tag">${esc(item.monitoring_source)}</span></li>`).join('');
    $('downgradeList').innerHTML = dc.watchlist.downgrade_signals.map(item => `<li><p>${esc(item.text)}</p><span class="tag">${esc(item.monitoring_source)}</span></li>`).join('');

    $('snapshotTitle').textContent = dc.operational_snapshot.title;
    $('snapshot').innerHTML = dc.operational_snapshot.metrics.map(item => `<div><span class="mini-label">${esc(item.label)}</span><strong>${esc(item.value)}</strong><p>${esc(item.period)}</p></div>`).join('');

    $('methodTitle').textContent = dc.method_notes.title;
    $('bottomLine').textContent = dc.bottom_line.text;
    $('methodNotes').innerHTML = dc.method_notes.notes.map(note => `<li><p>${esc(note)}</p></li>`).join('');
    $('sources').innerHTML = data.sources.map(src => `<div class="source-row"><strong>${esc(src.source_id)}</strong><a href="${esc(src.url)}" target="_blank" rel="noreferrer">${esc(src.title)}</a><span>${esc(src.publisher)}</span></div>`).join('');
    $('footerMeta').textContent = `${data.company} | Run ${data.research_run.run_id} | Scorer ${data.scorer_metadata.scorer_version} | Formula: ${data.scorer_metadata.formula}`;

    requestAnimationFrame(() => {
      document.querySelectorAll('[data-width]').forEach(el => el.style.width = el.dataset.width + '%');
    });
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.classList.add('in');
      });
    }, {threshold: 0.08});
    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
  </script>
</body>
</html>
