<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Innovation Dashboard</title>
  <style>
    :root {
      --dusty-rose: #d4a5a5;
      --clay: #b87d6d;
      --sand: #e8d5c4;
      --burgundy: #5d2e46;
      --paper: #fffaf7;
      --surface: #f6ebe4;
      --ink: #24181f;
      --muted: #6f5c62;
      --line: rgba(93, 46, 70, 0.16);
      --line-strong: rgba(93, 46, 70, 0.28);
      --green: #287865;
      --amber: #9a6929;
      --red: #9d3f47;
      --blue: #355f7a;
      --max: 1440px;
      --body: FreeSans, "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: var(--body);
      background:
        linear-gradient(90deg, rgba(93,46,70,.045) 1px, transparent 1px),
        linear-gradient(0deg, rgba(93,46,70,.035) 1px, transparent 1px),
        linear-gradient(180deg, #fffaf7 0%, #f5e5dd 54%, #ebd0c7 100%);
      background-size: 72px 72px, 72px 72px, auto;
    }
    a { color: var(--burgundy); text-underline-offset: .18em; }
    h1, h2, h3 { margin: 0; color: var(--burgundy); letter-spacing: 0; }
    h1 { max-width: 12ch; font-size: clamp(2.35rem, 5.4vw, 5.65rem); line-height: .93; }
    h2 { margin-bottom: 10px; font-size: clamp(1.18rem, 1.8vw, 1.62rem); line-height: 1.08; }
    h3 { margin-bottom: 6px; font-size: .98rem; line-height: 1.2; }
    p { margin: 0; color: var(--muted); line-height: 1.55; }
    .shell { width: min(calc(100% - 28px), var(--max)); margin: 0 auto; padding: 18px 0 54px; }
    .topbar { display: flex; justify-content: space-between; gap: 14px; padding: 8px 2px 18px; color: var(--muted); font-size: .9rem; }
    .topbar strong { color: var(--burgundy); }
    .app { overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: rgba(255,250,247,.94); box-shadow: 0 28px 80px rgba(93,46,70,.13); }
    .header {
      display: grid;
      grid-template-columns: minmax(0,1fr) 370px;
      gap: 30px;
      padding: 34px 32px;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(115deg, rgba(255,250,247,.98), rgba(246,235,228,.9) 62%, rgba(212,165,165,.34)),
        radial-gradient(circle at 92% 12%, rgba(184,125,109,.23), transparent 38%);
      animation: rise .55s ease both;
    }
    .kicker { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    .summary { max-width: 78ch; margin-top: 15px; }
    .score-panel { display: grid; gap: 16px; align-content: start; border-left: 1px solid var(--line); padding-left: 26px; }
    .score-ring {
      --p: 0%;
      width: 188px;
      aspect-ratio: 1;
      justify-self: end;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: radial-gradient(circle at center, var(--paper) 58%, transparent 60%), conic-gradient(var(--clay) var(--p), rgba(93,46,70,.12) 0);
      box-shadow: inset 0 0 0 1px rgba(93,46,70,.14), 0 14px 40px rgba(93,46,70,.15);
      animation: settle .7s ease both;
    }
    .score-ring strong { display: block; color: var(--burgundy); font-size: 3rem; line-height: 1; text-align: center; font-variant-numeric: tabular-nums; }
    .score-ring span { display: block; margin-top: 5px; color: var(--muted); font-size: .78rem; text-align: center; }
    .badge-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
    .badge { display: inline-flex; align-items: center; min-height: 30px; width: fit-content; padding: 7px 10px; border: 1px solid rgba(93,46,70,.15); border-radius: 6px; background: rgba(212,165,165,.27); color: var(--burgundy); font-size: .81rem; font-weight: 700; }
    .badge.good { background: rgba(40,120,101,.13); color: #24564a; border-color: rgba(40,120,101,.24); }
    .badge.warn { background: rgba(154,105,41,.13); color: #674617; border-color: rgba(154,105,41,.24); }
    .content { display: grid; grid-template-columns: minmax(0,1fr) 370px; }
    .main { padding: 30px 32px; }
    .side { border-left: 1px solid var(--line); padding: 30px 24px; background: rgba(246,235,228,.52); }
    section { padding: 26px 0; border-bottom: 1px solid var(--line); opacity: 0; transform: translateY(14px); transition: opacity .5s ease, transform .5s ease; }
    section.visible { opacity: 1; transform: translateY(0); }
    section:first-child { padding-top: 0; }
    section:last-child { border-bottom: 0; }
    .side section { opacity: 1; transform: none; }
    .split { display: grid; grid-template-columns: .9fr 1.1fr; gap: 26px; align-items: start; }
    .stack { display: grid; gap: 14px; }
    .list { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
    .list li { padding-left: 14px; border-left: 3px solid var(--dusty-rose); color: var(--ink); line-height: 1.48; }
    .meta { color: var(--muted); font-size: .76rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
    .row-item { border-top: 1px solid var(--line); padding-top: 12px; }
    .row-item p { font-size: .93rem; }
    .layers { display: grid; gap: 16px; margin-top: 14px; }
    .layer { padding: 16px 0 18px; border-top: 1px solid var(--line); transition: transform .18s ease; }
    .layer:hover { transform: translateX(4px); }
    .bar-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px; }
    .bar-head b { color: var(--burgundy); }
    .bar-head span { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
    .bar-track { height: 8px; overflow: hidden; border-radius: 999px; background: rgba(93,46,70,.12); }
    .bar-fill { height: 100%; width: var(--w); border-radius: inherit; background: linear-gradient(90deg, var(--clay), var(--burgundy)); box-shadow: 0 0 16px rgba(184,125,109,.36); transform-origin: left; animation: grow .9s ease both; }
    .layer-body { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 12px; }
    .small-label { display: block; margin-bottom: 4px; color: var(--burgundy); font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
    .chart { display: grid; gap: 9px; margin-top: 12px; }
    .chart-row { display: grid; grid-template-columns: 76px minmax(0,1fr) 112px; gap: 10px; align-items: center; font-size: .86rem; color: var(--muted); }
    .chart-row .track { height: 9px; background: rgba(93,46,70,.11); border-radius: 999px; overflow: hidden; }
    .chart-row .fill { height: 100%; width: var(--w); background: linear-gradient(90deg, var(--clay), var(--burgundy)); border-radius: inherit; }
    .chart-row b { color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }
    .snapshot { display: grid; gap: 10px; }
    .metric { display: flex; justify-content: space-between; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .metric span { color: var(--muted); font-size: .86rem; }
    .metric b { color: var(--burgundy); font-variant-numeric: tabular-nums; text-align: right; }
    .risk .severity { color: var(--red); font-weight: 700; font-size: .76rem; text-transform: uppercase; letter-spacing: .08em; }
    .source-list { display: grid; gap: 10px; max-height: 510px; overflow: auto; padding-right: 6px; }
    .source-list .row-item a { font-weight: 700; }
    .source-list p { font-size: .82rem; }
    .note { color: var(--muted); font-size: .9rem; line-height: 1.5; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes settle { from { transform: scale(.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @media (max-width: 980px) {
      .header, .content, .split, .layer-body { grid-template-columns: 1fr; }
      .score-panel, .side { border-left: 0; padding-left: 0; }
      .score-ring { justify-self: start; width: 152px; }
      .main, .side, .header { padding: 22px; }
      h1 { max-width: 10ch; }
      .chart-row { grid-template-columns: 64px minmax(0,1fr) 86px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
      section { opacity: 1; transform: none; }
    }
  </style>
</head>

perating lease obligations, and ongoing Blackstone-related payments tied to Leqvio, zilebesiran, and vutrisiran economics.", "raw_value": 22.7, "raw_unit": "percent COGS / net product revenue", "period_start": "2025", "period_end": "2025", "company_attributable": true, "field_proxy": false, "quote_or_excerpt": "", "location": "2025 10-K MD&A", "verified": true, "limitations": "The economics are company-level and do not isolate each technology domain."}, {"evidence_id": "ev_university_network", "source_id": "src_pubmed_rnai_design", "layer": "Science", "metric_codes": ["citation_velocity_or_quality", "science_to_application_linkage"], "fact_type": "raw_observation", "fact": "Accessible academic evidence links RNAi/GalNAc/extrahapetic research to UMass Chan, Aarhus University, Uppsala University, Stanford, UCL, Boston University, Brigham and Women's Hospital, Mayo Clinic, and other clinical research centers.", "raw_value": 9, "raw_unit": "institutions", "period_start": "2021", "period_end": "2025", "company_attributable": false, "field_proxy": true, "quote_or_excerpt": "", "location": "PubMed, Nature Index, ACC and trial source set", "verified": true, "limitations": "Institution list is not a full co-authorship network analysis."}, {"evidence_id": "ev_red_flags", "source_id": "src_sec_2025_10k", "layer": "Policy & Economics", "metric_codes": ["economic_readiness"], "fact_type": "risk_observation", "fact": "Key risks include continued dependence on AMVUTTRA/TTR growth, reimbursement and regulatory risks, royalty/collaboration economics, manufacturing scale-up execution, and uncertainty in extrahepatic delivery.", "raw_value": null, "raw_unit": "risk set", "period_start": "2025", "period_end": "2026", "company_attributable": true, "field_proxy": false, "quote_or_excerpt": "", "location": "2025 10-K risk factors and primary company materials", "verified": true, "limitations": "Risk severity is analyst judgment based on disclosed facts."}], "normalization_notes": [{"metric_code": "publication_growth", "rule": "normalize_growth_proxy_with_floor(start, end, years) with qualitative source discount", "reason": "Only a minimum confirmed publication proxy was available."}, {"metric_code": "patent_family_growth", "rule": "normalize_growth_proxy_with_confidence_discount", "reason": "Public patent pages are a record-listing proxy, not family-by-year analytics."}, {"metric_code": "revenue_or_booking_evidence", "rule": "normalize_growth_and_scale using 5-year product revenue and Q1 2026 revenue growth", "reason": "Real product revenue is the strongest adoption signal for commercial RNAi."}, {"metric_code": "manufacturing_or_deployment_evidence", "rule": "normalize_scale_plus_quality", "reason": "Industrialization depends on commercial/clinical manufacturing proof, not only capex dollars."}, {"metric_code": "economic_readiness", "rule": "scale_adjusted_for_burdens", "reason": "Revenue scale is tempered by royalties, COGS, debt, and reimbursement risks."}], "dashboard_content": {"hero": {"headline": "Alnylam Pharmaceuticals", "subheadline": "Single-company innovation readiness assessment for RNAi translation across liver-targeted therapeutics, extrahepatic delivery, and siRNA manufacturing, based on evidence available on 2026-05-12.", "verdict_label": "Exceptional innovator and plausible scale-up candidate", "evidence_ids": ["ev_company_scale_2025", "ev_q1_2026", "ev_sirelis"], "source_ids": ["src_sec_2025_10k", "src_q1_2026_release", "src_sirelis_expansion"]}, "thesis": {"title": "Thesis", "summary": "Alnylam is one of the few platform biotechs where the science, IP, manufacturing system, and adoption evidence all reinforce each other. The main caveat is concentration in TTR/AMVUTTRA and the still-unproven commercial scale of extrahepatic delivery.", "bullets": [{"text": "The commercial RNAi platform is validated: six marketed products, four direct Alnylam products, two partner-commercialized products, and Q1 2026 net product revenue above $1.0 billion.", "claim_ids": ["claim_commercial_scale"], "evidence_ids": ["ev_company_scale_2025", "ev_q1_2026"], "source_ids": ["src_sec_2025_10k", "src_q1_2026_release"]}, {"text": "AMVUTTRA's ATTR-CM approval converted pivotal science into a large adoption curve and gave Alnylam a durable TTR franchise to fund the next platform wave.", "claim_ids": ["claim_attrcm_adoption"], "evidence_ids": ["ev_amvuttra_approval", "ev_q1_2026"], "source_ids": ["src_amvuttra_attrcm_approval", "src_q1_2026_release"]}, {"text": "The next innovation step is less about proving RNAi works in the liver and more about lowering siRNA manufacturing cost while extending delivery beyond hepatocytes.", "claim_ids": ["claim_next_platform"], "evidence_ids": ["ev_delivery_platforms", "ev_sirelis", "ev_cns_patent"], "source_ids": ["src_delivery_platforms", "src_sirelis_expansion", "src_google_cns_patent"]}, {"text": "The score is high, but not risk-free: reimbursement, royalty obligations, trial execution, manufacturing scale-up, and extrahepatic delivery remain watch items.", "claim_ids": ["claim_red_flags"], "evidence_ids": ["ev_red_flags", "ev_economic_constraints"], "source_ids": ["src_sec_2025_10k"]}]}, "technology_map": {"title": "Technology Map", "summary": "The material innovation domains are the commercial liver-targeted RNAi platform, the extrahepatic delivery expansion, and the siRELIS manufacturing scale-up.", "items": [{"name": "Liver-targeted RNAi and TTR franchise", "description": "GalNAc-conjugated siRNA and LNP roots support approved products including AMVUTTRA, GIVLAARI, OXLUMO and partner products. The TTR franchise is the main commercial engine.", "maturity": "commercial", "evidence_ids": ["ev_delivery_platforms", "ev_company_scale_2025", "ev_q1_2026"], "source_ids": ["src_delivery_platforms", "src_sec_2025_10k", "src_q1_2026_release"]}, {"name": "Extrahepatic RNAi delivery", "description": "C16 and peptide-ligand work targets CNS, eye, lung and newer tissue expansion. This is st   <div class="shell">
    <div class="topbar"><div><strong id="topCompany"></strong> <span id="topTicker"></span></div><div id="topDate"></div></div>
    <div class="app">
      <header class="header">
        <div>
          <div class="kicker">Innovation Readiness Dashboard</div>
          <h1 id="headline"></h1>
          <p class="summary" id="subheadline"></p>
          <div class="badge-row" id="heroBadges"></div>
        </div>
        <aside class="score-panel">
          <div class="score-ring" id="scoreRing"><div><strong id="scoreValue"></strong><span>out of 25</span></div></div>
          <div class="stack"><div class="meta">Deterministic Verdict</div><h2 id="verdict"></h2><p class="note" id="gate"></p></div>
        </aside>
      </header>
      <div class="content">
        <main class="main">
          <section id="thesis"></section>
          <section id="layers"></section>
          <section id="technology"></section>
          <section id="quant"></section>
          <section id="commercial"></section>
          <section id="gateSection"></section>
          <section id="research"></section>
          <section id="patents"></section>
          <section id="risks"></section>
          <section id="watchlist"></section>
          <section id="bottom"></section>
          <section id="sources"></section>
        </main>
        <aside class="side">
          <section id="snapshot"></section>
          <section id="method"></section>
        </aside>
      </div>
    </div>
  </div>
  <script>
    const data = JSON.parse(document.getElementById("scored-data").textContent);
    const dc = data.dashboard_content;
    const el = (id) => document.getElementById(id);
    const esc = (value) => String(value ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;");
    const pct = (value, max = 5) => Math.max(0, Math.min(100, (Number(value) / max) * 100));
    const list = (items) => '<ul class="list">' + items.map((item) => '<li>' + esc(item.text || item.condition || item) + '</li>').join("") + '</ul>';
    const row = (cls, body) => '<article class="row-item ' + cls + '">' + body + '</article>';
    el("topCompany").textContent = data.company;
    el("topTicker").textContent = data.ticker;
    el("topDate").textContent = "Research date: " + data.research_run.research_date;
    el("headline").textContent = dc.hero.headline;
    el("subheadline").textContent = dc.hero.subheadline;
    el("scoreValue").textContent = data.display_total_score;
    el("scoreRing").style.setProperty("--p", (data.total_score / 25 * 100).toFixed(1) + "%");
    el("verdict").textContent = data.verdict;
    el("gate").textContent = data.gate_pass ? "Breakthrough gate passes: industrialization and adoption both clear the readiness threshold." : "Breakthrough gate does not pass because industrialization or adoption remains below threshold.";
    el("heroBadges").innerHTML = [
      '<span class="badge good">Gate: ' + (data.gate_pass ? 'Pass' : 'Fail') + '</span>',
      '<span class="badge">Mode: ' + esc(data.mode) + '</span>',
      '<span class="badge warn">Readiness: ' + esc(data.display_total_score) + ' / 25</span>'
    ].join("");
    el("thesis").innerHTML = `<div class="split"><div><h2>${esc(dc.thesis.title)}</h2><p>${esc(dc.thesis.summary)}</p></div><div>${list(dc.thesis.bullets)}</div></div>`;
    el("layers").innerHTML = '<h2>Five-Layer Score</h2><div class="layers">' + data.layers.map(layer => `<article class="layer"><div class="bar-head"><b>${esc(layer.label)}</b><span>${esc(layer.display_score)} / 5</span></div><div class="bar-track"><div class="bar-fill" style="--w:${pct(layer.score).toFixed(1)}%"></div></div><div class="layer-body"><p><span class="small-label">Evidence</span>${esc(layer.summary)}</p><p><span class="small-label">Strong</span>${esc(layer.strong)}</p><p><span class="small-label">Missing</span>${esc(layer.missing)}</p><p><span class="small-label">Confidence</span>${esc(layer.confidence)}; coverage ${Math.round(layer.coverage_ratio * 100)}%</p></div></article>`).join("") + '</div>';
    el("technology").innerHTML = '<h2>' + esc(dc.technology_map.title) + '</h2><p>' + esc(dc.technology_map.summary) + '</p><div class="stack" style="margin-top:16px">' + dc.technology_map.items.map(item => row('', `<div class="meta">${esc(item.maturity)}</div><h3>${esc(item.name)}</h3><p>${esc(item.description)}</p>`)).join("") + '</div>';
    const chartHtml = (chart) => {
      const all = chart.series.flatMap(s => s.points.map(p => Number(p.value)));
      const max = Math.max(...all, 1);
      return row('', `<h3>${esc(chart.title)}</h3><p>${esc(chart.description)}</p><div class="chart">${chart.series.map(series => series.points.map(point => `<div class="chart-row"><span>${esc(point.period)}</span><div class="track"><div class="fill" style="--w:${(Number(point.value) / max * 100).toFixed(1)}%"></div></div><b>${esc(point.value)} ${esc(series.unit.replace("USD ", ""))}</b></div>`).join("")).join("")}</div>`);
    };
    el("quant").innerHTML = '<h2>' + esc(dc.quantitative_signals.title) + '</h2><p>' + esc(dc.quantitative_signals.summary) + '</p><div class="stack" style="margin-top:14px">' + dc.quantitative_signals.charts.map(chartHtml).join("") + '</div>';
    el("commercial").innerHTML = '<h2>' + esc(dc.commercialization_evidence.title) + '</h2><p>' + esc(dc.commercialization_evidence.summary) + '</p><div class="stack" style="margin-top:14px">' + dc.commercialization_evidence.items.map(item => row('', `<div class="meta">${esc(item.label)}</div><p>${esc(item.text)}</p>`)).join("") + '</div>';
    el("gateSection").innerHTML = `<h2>${esc(dc.breakthrough_gate.title)}</h2><p>${esc(dc.breakthrough_gate.summary)}</p><div class="split" style="margin-top:16px"><div><h3>Conditions Met</h3>${list(dc.breakthrough_gate.conditions_met)}</div><div><h3>Conditions Not Met</h3>${list(dc.breakthrough_gate.conditions_not_met)}</div></div>`;
    el("research").innerHTML = '<h2>' + esc(dc.university_research_signals.title) + '</h2><p>' + esc(dc.university_research_signals.summary) + '</p><div class="stack" style="margin-top:14px">' + dc.university_research_signals.institutions.map(item => row('', `<h3>${esc(item.name)}</h3><p>${esc(item.signal)}</p>`)).join("") + '</div>';
    el("patents").innerHTML = '<h2>' + esc(dc.patent_signals.title) + '</h2><p>' + esc(dc.patent_signals.summary) + '</p><div class="stack" style="margin-top:14px">' + dc.patent_signals.families.map(item => row('', `<div class="meta">${esc(item.publication_or_family_id)} | ${esc(item.jurisdictions.join(", "))}</div><h3>${esc(item.title)}</h3><p>${esc(item.interpretation)}</p>`)).join("") + '</div><p class="note" style="margin-top:12px">' + esc(dc.patent_signals.interpretation) + '</p>';
    el("risks").innerHTML = '<h2>Red Flags</h2><div class="stack">' + dc.red_flags.map(risk => row('risk', `<div class="severity">${esc(risk.severity)} | ${esc(risk.layer)}</div><h3>${esc(risk.title)}</h3><p>${esc(risk.text)}</p>`)).join("") + '</div>';
    el("watchlist").innerHTML = `<h2>${esc(dc.watchlist.title)}</h2><div class="split"><div><h3>Upgrade Signals</h3>${list(dc.watchlist.upgrade_signals)}</div><div><h3>Downgrade Signals</h3>${list(dc.watchlist.downgrade_signals)}</div></div>`;
    el("bottom").innerHTML = '<h2>' + esc(dc.bottom_line.title) + '</h2><p>' + esc(dc.bottom_line.text) + '</p>';
    el("snapshot").innerHTML = '<h2>' + esc(dc.operational_snapshot.title) + '</h2><div class="snapshot">' + dc.operational_snapshot.metrics.map(metric => `<div class="metric"><span>${esc(metric.label)}</span><b>${esc(metric.value)}</b></div>`).join("") + '</div>';
    el("method").innerHTML = '<h2>' + esc(dc.method_notes.title) + '</h2>' + dc.method_notes.notes.map(note => '<p class="note" style="margin-bottom:10px">' + esc(note) + '</p>').join("");
    el("sources").innerHTML = '<h2>Sources</h2><div class="source-list">' + data.sources.map(source => row('', `<a href="${esc(source.url)}">${esc(source.title)}</a><p>${esc(source.publisher)} | ${esc(source.document_date)} | ${esc(source.source_type)}</p>`)).join("") + '</div>';
    const observer = new IntersectionObserver(entries => { entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add("visible"); }); }, { threshold: .08 });
    document.querySelectorAll("main section").forEach(section => observer.observe(section));
  </script>
